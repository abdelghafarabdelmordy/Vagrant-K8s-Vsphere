# For testing Traefik once it's installed - see README.md.
# `whoami` just echoes the request it received, so a successful curl proves
# the whole path (MetalLB VIP -> Traefik -> Service -> Pod) works.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whoami
  template:
    metadata:
      labels:
        app: whoami
    spec:
      containers:
        - name: whoami
          image: traefik/whoami
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: whoami
  namespace: default
spec:
  selector:
    app: whoami
  ports:
    - port: 80
      targetPort: 80
---
# Plain Kubernetes Ingress - this is the direct replacement for any manifest
# that used to say `ingressClassName: nginx`. Traefik also supports its own
# richer IngressRoute CRD if you need it later (see values.yaml).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: whoami
  namespace: default
spec:
  ingressClassName: traefik
  rules:
    - host: whoami.k8s-demo.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: whoami
                port:
                  number: 80
