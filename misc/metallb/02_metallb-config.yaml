apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: first-pool
  namespace: metallb-system
spec:
  addresses:
  # Free range on the real 10.10.10.0/24 lab network - avoids the addresses
  # already in use: .1 (gateway), .41/.42 (kworker1/2), .240 (kmaster) and
  # .250 (vCenter). Adjust if your real VM network/VLAN differs.
  - 10.10.10.220-10.10.10.230
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: metallb-l2adv
  namespace: metallb-system
